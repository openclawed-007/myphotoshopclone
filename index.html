<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Overlay Studio</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <!-- Updated Font Awesome to avoid Firefox glyph bbox warnings -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <i class="fas fa-layer-group"></i>
                    Image Overlay Studio
                </h1>
                <div class="header-actions">
                    <button class="btn btn-primary" id="addImageBtn">
                        <i class="fas fa-plus"></i>
                        Add Image
                    </button>
                    <button class="btn btn-secondary" id="autoFitBtn">
                        <i class="fas fa-expand-arrows-alt"></i>
                        Auto Fit
                    </button>
                    <button class="btn btn-secondary" id="clearAllBtn">
                        <i class="fas fa-trash"></i>
                        Clear All
                    </button>
                    <button class="btn btn-secondary" id="saveBtn">
                        <i class="fas fa-download"></i>
                        Save
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>Layers</h3>
                    <span class="layer-count" id="layerCount">0 layers</span>
                </div>
                
                <div class="layers-container" id="layersContainer">
                    <div class="empty-state">
                        <i class="fas fa-images"></i>
                        <p>No layers yet</p>
                        <p class="empty-subtitle">Add images to get started</p>
                    </div>
                </div>
            </aside>
            <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="280" aria-valuemax="640" aria-valuenow="300"></div>

            <!-- Canvas Area -->
            <main class="canvas-area">
                <div class="canvas-container" id="canvasContainer">
                    <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Add images by browsing or dropping">
                        <div class="drop-zone-content">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h3>Drop images here</h3>
                            <p>or click "Add Image" to browse</p>
                            <div class="supported-formats">
                                Supports: JPG, PNG, GIF, WebP
                            </div>
                        </div>
                    </div>
                    <canvas id="mainCanvas"></canvas>
                    <!-- Crop Overlay -->
                    <div class="crop-overlay" id="cropOverlay" aria-hidden="true">
                        <div class="crop-rect" id="cropRect">
                            <div class="handle handle-nw" data-handle="nw"></div>
                            <div class="handle handle-ne" data-handle="ne"></div>
                            <div class="handle handle-sw" data-handle="sw"></div>
                            <div class="handle handle-se" data-handle="se"></div>
                            <div class="handle handle-n" data-handle="n"></div>
                            <div class="handle handle-s" data-handle="s"></div>
                            <div class="handle handle-e" data-handle="e"></div>
                            <div class="handle handle-w" data-handle="w"></div>
                        </div>
                        <div class="crop-toolbar" id="cropToolbar">
                            <button class="mini-btn" id="applyCropBtn" title="Apply crop"><i class="fas fa-check"></i> Apply</button>
                            <button class="mini-btn" id="cancelCropBtn" title="Cancel crop"><i class="fas fa-xmark"></i> Cancel</button>
                        </div>
                    </div>
                    <div class="zoom-controls" id="zoomControls" aria-label="Canvas zoom controls">
                        <button class="zoom-btn" id="zoomOutBtn" title="Zoom out">
                            <i class="fas fa-minus"></i>
                        </button>
                        <input type="range" id="zoomSlider" min="25" max="400" value="100" aria-label="Zoom level" />
                        <button class="zoom-btn" id="zoomInBtn" title="Zoom in">
                            <i class="fas fa-plus"></i>
                        </button>
                        <span class="zoom-display" id="zoomDisplay">100%</span>
                        <button class="zoom-btn" id="zoomResetBtn" title="Reset zoom">
                            <i class="fas fa-undo"></i>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept="image/*" multiple class="file-input-visually-hidden">

    <!-- Floating live preview (helps when sliders are far down) -->
    <div class="floating-preview hidden" id="floatingPreview" aria-label="Live preview">
        <canvas id="previewCanvas"></canvas>
        <div class="floating-preview-label"><i class="fas fa-eye"></i> Preview</div>
    </div>

    <!-- Layer Template -->
    <template id="layerTemplate">
        <div class="layer-item" data-layer-id="">
            <div class="layer-preview">
                <img src="" alt="Layer preview">
            </div>
            <div class="layer-content">
                <div class="layer-header">
                    <span class="layer-name"></span>
                    <div class="layer-actions">
                        <button class="layer-btn visibility-btn" title="Toggle visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="layer-btn delete-btn" title="Delete layer">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="layer-controls">
                    <div class="adjustments">
                        <button class="adjustments-toggle" type="button" aria-expanded="false">
                            <span class="label">Adjustments</span>
                            <i class="fas fa-chevron-down chevron" aria-hidden="true"></i>
                        </button>
                        <div class="adjustments-panel">
                            <div class="opacity-control">
                                <label>Opacity</label>
                                <div class="slider-container">
                                    <input type="range" class="opacity-slider" min="0" max="100" value="100">
                                    <span class="opacity-value">100%</span>
                                    <button class="icon-btn reset-opacity" title="Reset opacity" aria-label="Reset opacity"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group">
                                <label>Brightness</label>
                                <div class="slider-container">
                                    <input type="range" class="brightness-slider" min="0" max="200" value="100">
                                    <span class="brightness-value">100%</span>
                                    <button class="icon-btn reset-brightness" title="Reset brightness" aria-label="Reset brightness"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group">
                                <label>Contrast</label>
                                <div class="slider-container">
                                    <input type="range" class="contrast-slider" min="0" max="200" value="100">
                                    <span class="contrast-value">100%</span>
                                    <button class="icon-btn reset-contrast" title="Reset contrast" aria-label="Reset contrast"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group">
                                <label>Saturation</label>
                                <div class="slider-container">
                                    <input type="range" class="saturation-slider" min="0" max="200" value="100">
                                    <span class="saturation-value">100%</span>
                                    <button class="icon-btn reset-saturation" title="Reset saturation" aria-label="Reset saturation"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group">
                                <label>Hue</label>
                                <div class="slider-container">
                                    <input type="range" class="hue-slider" min="0" max="360" value="0">
                                    <span class="hue-value">0°</span>
                                    <button class="icon-btn reset-hue" title="Reset hue" aria-label="Reset hue"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group">
                                <label>Blur</label>
                                <div class="slider-container">
                                    <input type="range" class="blur-slider" min="0" max="10" value="0">
                                    <span class="blur-value">0px</span>
                                    <button class="icon-btn reset-blur" title="Reset blur" aria-label="Reset blur"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group">
                                <label>Grayscale</label>
                                <div class="slider-container">
                                    <input type="range" class="grayscale-slider" min="0" max="100" value="0">
                                    <span class="grayscale-value">0%</span>
                                    <button class="icon-btn reset-grayscale" title="Reset grayscale" aria-label="Reset grayscale"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group rotate-group">
                                <label>Rotate</label>
                                <div class="slider-container">
                                    <button class="mini-btn rotate-left" title="Rotate -90°">↺</button>
                                    <input type="range" class="rotation-slider" min="-180" max="180" value="0">
                                    <button class="mini-btn rotate-right" title="Rotate +90°">↻</button>
                                    <span class="rotation-value">0°</span>
                                    <button class="icon-btn reset-rotation" title="Reset rotation" aria-label="Reset rotation"><i class="fas fa-undo"></i></button>
                                </div>
                            </div>
                            <div class="control-group flips-group">
                                <label>Flip</label>
                                <div class="flip-buttons">
                                    <button class="toggle-btn flip-h" title="Flip horizontal">Flip H</button>
                                    <button class="toggle-btn flip-v" title="Flip vertical">Flip V</button>
                                    <button class="mini-btn reset-adjust" title="Reset adjustments">Reset</button>
                                </div>
                            </div>
                            <div class="control-group crop-group">
                                <label>Crop</label>
                                <div class="flip-buttons">
                                    <button class="mini-btn start-crop" title="Start crop"><i class="fas fa-crop"></i> Start</button>
                                    <button class="mini-btn apply-crop" title="Apply crop" disabled><i class="fas fa-check"></i> Apply</button>
                                    <button class="mini-btn cancel-crop" title="Cancel crop" disabled><i class="fas fa-xmark"></i> Cancel</button>
                                    <button class="mini-btn clear-crop" title="Clear crop" disabled><i class="fas fa-ban"></i> Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layer-drag-area">
                <div class="layer-drag-handle">
                    <i class="fas fa-grip-vertical"></i>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>

    <!-- Status Bar -->
    <footer class="status-bar" aria-label="App status and shortcuts">
        <div class="status-content">
            <span class="status-item"><i class="fas fa-keyboard"></i> Shortcuts: <kbd>I</kbd> Add Image · <kbd>A</kbd> Auto Fit · <kbd>C</kbd> Clear</span>
            <span class="status-item"><i class="fas fa-magnifying-glass"></i> Zoom: Ctrl + Mouse Wheel</span>
            <span class="status-item"><i class="fas fa-hand-pointer"></i> Pan: Drag when zoomed in</span>
        </div>
    </footer>
</body>
</html>
